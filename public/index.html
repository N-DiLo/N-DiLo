<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Status</title>
</head>

<body>
    <h1>GitHub Repository Status for <span id="username"></span></h1>
    <ul id="repos"></ul>

    <script>
        const username = 'N-DiLo';

        fetch(`/api/status?username=${username}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error(data.error);
                    return;
                }

                document.getElementById('username').textContent = data.username;
                const reposList = document.getElementById('repos');

                data.repos.forEach(repo => {
                    const li = document.createElement('li');
                    li.innerHTML = `
            <strong>${repo.name}</strong><br>
            <a href="${repo.url}" target="_blank">${repo.url}</a><br>
            Stars: ${repo.stars} | Forks: ${repo.forks} | Issues: ${repo.issues}
          `;
                    reposList.appendChild(li);
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
</body>

</html>
